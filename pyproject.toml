[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "defi-stress-lab"
version = "0.2.0"
description = "Cutoff-safe Terra historical replay and read-only Aave V3 stress research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "matplotlib>=3.9,<4",
  "networkx>=3.4,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<24",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
  "web3>=7.0,<8",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.112,<7",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
  "types-networkx>=3.4,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["backend", "sim"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests", "sim/tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
  "data/raw",
  "diagnose_terra_v4_remaining*.py",
  "terra_may2022_v1_pack",
  "terra_pack_v2",
  "terra_pack_v3",
  "terra_pack_v4",
  "terra_pack_v5",
  "terra_pack_v6",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"backend/app/api.py" = ["B008"]
"backend/app/terra_api.py" = ["B008"]
"scripts/research/package_builder.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["sim"]
exclude = ["sim/tests"]
