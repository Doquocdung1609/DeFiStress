name: V2 Phase01-A historical data pilot
on:
  push:
    branches: [research/v2-phase01a-historical-data]
    paths:
      - docs/research_v2/phase01a/**
      - tests/test_phase01a_pilot.py
      - .github/workflows/v2-phase01a-pilot.yml
permissions:
  contents: read
jobs:
  read-only-historical-data:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Install tested V1 target lock without changing it
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r docs/research_v2/phase00/g1/requirements-windows-py312.lock.txt
      - name: Execute preregistered read-only source feasibility
        run: python docs/research_v2/phase01a/pilot.py --registry docs/research_v2/phase01a/PILOT_SAMPLE_REGISTRY.json --output "$env:RUNNER_TEMP/phase01a"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase01a-pilot-${{ github.run_id }}
          path: ${{ runner.temp }}/phase01a/
          if-no-files-found: error
