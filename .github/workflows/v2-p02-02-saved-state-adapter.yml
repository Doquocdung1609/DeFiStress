name: V2 P02-02 read-only saved-state adapter

on:
  push:
    branches: [research/v2-p02-02-saved-state-adapter]
    paths:
      - defistress_v2/**
      - tests/v2/**
      - scripts/research/validate_p02_02_saved_adapter.py
      - docs/research_v2/p02_02/**
      - pyproject.toml
      - .github/workflows/v2-p02-02-saved-state-adapter.yml
  pull_request:
    paths:
      - defistress_v2/**
      - tests/v2/**
      - scripts/research/validate_p02_02_saved_adapter.py
      - docs/research_v2/p02_02/**
      - pyproject.toml
      - .github/workflows/v2-p02-02-saved-state-adapter.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-saved-state-adapter:
    # Python 3.12.10 is not published for the Ubuntu 26.04 image currently
    # behind ubuntu-latest. Pin the runner image to preserve the exact runtime.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Install scoped quality and build tools
        run: python -m pip install pytest==8.4.2 ruff==0.17.1 mypy==1.20.2 build==1.3.0
      - name: Prepare evidence directory
        run: mkdir -p "$RUNNER_TEMP/p02-02"
      - name: Ruff
        run: ruff check defistress_v2 tests/v2 scripts/research/validate_p02_02_saved_adapter.py
      - name: Strict mypy
        if: always()
        run: mypy --strict defistress_v2
      - name: P02-02 targeted tests
        id: p0202
        if: always()
        run: python -m pytest -q tests/v2/test_saved_adapter.py tests/v2/test_saved_adapter_review.py --junitxml="$RUNNER_TEMP/p02-02/p02-02-junit.xml"
      - name: Accepted P02-01 contracts
        id: p0201
        if: always()
        run: python -m pytest -q tests/v2/test_contracts.py --junitxml="$RUNNER_TEMP/p02-02/p02-01-junit.xml"
      - name: Existing pre-Phase02 regressions
        id: legacy
        if: always()
        run: python -m pytest -q tests/test_prephase02_offline.py --junitxml="$RUNNER_TEMP/p02-02/prephase02-junit.xml"
      - name: Registered offline smoke
        if: always()
        run: >-
          python scripts/research/validate_p02_02_saved_adapter.py
          --source-commit "${{ github.event.pull_request.head.sha || github.sha }}"
          --output "$RUNNER_TEMP/p02-02/SMOKE_REPORT.json"
      - name: L1 integrity validation
        if: always()
        run: >-
          python docs/research_v2/prephase02_offline/validate_offline.py
          --validator-commit "${{ github.event.pull_request.head.sha || github.sha }}"
          --output "$RUNNER_TEMP/p02-02/VALIDATION_GATES.json"
          --l2-junit "$RUNNER_TEMP/p02-02/prephase02-junit.xml"
          --l2-exit-code "${{ steps.legacy.outcome == 'success' && '0' || '1' }}"
      - name: Build and verify wheel
        if: always()
        shell: bash
        run: |
          python -m build --wheel --outdir "$RUNNER_TEMP/p02-02/dist"
          python -m zipfile -l "$RUNNER_TEMP/p02-02/dist/"*.whl > "$RUNNER_TEMP/p02-02/wheel-contents.txt"
          python - <<'PYCODE'
          import os, pathlib, zipfile
          wheel = next((pathlib.Path(os.environ["RUNNER_TEMP"]) / "p02-02/dist").glob("*.whl"))
          sources = list(pathlib.Path("defistress_v2").rglob("*.py")) + [pathlib.Path("defistress_v2/py.typed")]
          with zipfile.ZipFile(wheel) as archive:
              for path in sources:
                  assert archive.read(path.as_posix()) == path.read_bytes(), path
          print(f"Verified {len(sources)} exact V2 wheel entries")
          PYCODE
      - name: Protected-tree preservation
        if: always()
        shell: bash
        run: |
          git diff --exit-code "${{ github.event.pull_request.base.sha || '817b0f85547963939841e8bc7181e55b2b84d86f' }}" -- \
            docs/research_v2/phase01a docs/research_v2/phase01b data docs/research_final docs/manuscript_p3 sim backend
      - name: Runtime provenance
        if: always()
        shell: bash
        run: |
          {
            echo "workflow_head=${{ github.event.pull_request.head.sha || github.sha }}"
            echo "checkout_commit=$(git rev-parse HEAD)"
            echo "checkout_tree=$(git rev-parse HEAD^{tree})"
            python -VV
            pytest --version
            ruff --version
            mypy --version
          } > "$RUNNER_TEMP/p02-02/execution-metadata.txt"
      - name: Artifact byte checksums
        if: always()
        shell: bash
        run: |
          cd "$RUNNER_TEMP/p02-02"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p02-02-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/p02-02
          if-no-files-found: error
          retention-days: 30
