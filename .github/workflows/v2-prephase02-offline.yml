name: V2 pre-Phase02 L1 L2 offline validation
on:
  push:
    branches: [research/v2-prephase02-offline-contracts]
    paths:
      - docs/research_v2/prephase02_offline/**
      - tests/test_prephase02_offline.py
      - .github/workflows/v2-prephase02-offline.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing lightweight test runner
        run: python -m pip install pytest==8.4.2
      - name: Execute L1 full preserved-file verification
        run: |
          mkdir -p "$RUNNER_TEMP/prephase02"
          python docs/research_v2/prephase02_offline/validate_offline.py --validator-commit "$GITHUB_SHA" --output "$RUNNER_TEMP/prephase02/VALIDATION_GATES.json"
      - name: Execute L2 pure synthetic controls
        id: l2
        if: always()
        run: |
          python -m pytest -q tests/test_prephase02_offline.py --junitxml="$RUNNER_TEMP/prephase02/l2-junit.xml"
      - name: Finalize machine report from actual JUnit
        if: always()
        run: |
          python docs/research_v2/prephase02_offline/validate_offline.py \
            --validator-commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/prephase02/VALIDATION_GATES.json" \
            --l2-junit "$RUNNER_TEMP/prephase02/l2-junit.xml" \
            --l2-exit-code "${{ steps.l2.outcome == 'success' && '0' || '1' }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prephase02-offline-${{ github.run_id }}
          path: ${{ runner.temp }}/prephase02/
          if-no-files-found: error
