name: V2 Terra P04-02 synthetic PIT contracts

on:
  push:
    branches: [research/terra-v2-p04-02-pit-contracts]
    paths:
      - defistress_v2/terra_pit/**
      - tests/v2/terra_pit/**
      - docs/research_v2/terra_early_warning/p04_01/**
      - docs/research_v2/terra_early_warning/p04_02/**
      - scripts/research/terra_v2/audit_p04_01.py
      - tests/research_v2/test_terra_p04_01_audit.py
      - pyproject.toml
      - .github/workflows/v2-terra-pit-contracts.yml
  pull_request:
    paths:
      - defistress_v2/terra_pit/**
      - tests/v2/terra_pit/**
      - docs/research_v2/terra_early_warning/p04_01/**
      - docs/research_v2/terra_early_warning/p04_02/**
      - scripts/research/terra_v2/audit_p04_01.py
      - tests/research_v2/test_terra_p04_01_audit.py
      - pyproject.toml
      - .github/workflows/v2-terra-pit-contracts.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-terra-pit-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Install scoped quality and build tools
        run: python -m pip install pytest==8.4.2 pytest-cov==7.0.0 ruff==0.17.1 mypy==1.20.2 build==1.3.0
      - name: Prepare evidence directory
        run: mkdir -p "$RUNNER_TEMP/p04-02"
      - name: Ruff
        run: ruff check defistress_v2/terra_pit tests/v2/terra_pit
      - name: Strict mypy
        if: always()
        run: mypy --strict defistress_v2/terra_pit
      - name: P04-02 synthetic controls
        if: always()
        run: >-
          python -m pytest -q tests/v2/terra_pit
          --junitxml="$RUNNER_TEMP/p04-02/p04-02-junit.xml"
          --cov=defistress_v2.terra_pit --cov-report=json:"$RUNNER_TEMP/p04-02/coverage.json"
      - name: P04-01 audit regressions
        if: always()
        run: python -m pytest -q tests/research_v2/test_terra_p04_01_audit.py --junitxml="$RUNNER_TEMP/p04-02/p04-01-junit.xml"
      - name: P04-01 registered 35-input audit
        if: always()
        run: >-
          python scripts/research/terra_v2/audit_p04_01.py
          --repo-root .
          --registry docs/research_v2/terra_early_warning/p04_01/P04_01_DATASET_REGISTRY.json
          --output "$RUNNER_TEMP/p04-02/P04_01_SOURCE_AUDIT.json"
      - name: P04-02 saved-metadata smoke
        if: always()
        run: >-
          python -m defistress_v2.terra_pit.validate
          --implementation-commit "${{ github.event.pull_request.head.sha || github.sha }}"
          --output "$RUNNER_TEMP/p04-02/P04_02_VALIDATION_REPORT.json"
      - name: Accepted P02-01 contracts
        if: always()
        run: python -m pytest -q tests/v2/test_contracts.py --junitxml="$RUNNER_TEMP/p04-02/p02-01-junit.xml"
      - name: Accepted P02-02 adapter
        if: always()
        run: >-
          python -m pytest -q tests/v2/test_saved_adapter.py tests/v2/test_saved_adapter_review.py
          --junitxml="$RUNNER_TEMP/p04-02/p02-02-junit.xml"
      - name: Existing pre-Phase02 offline regressions
        id: legacy
        if: always()
        run: python -m pytest -q tests/test_prephase02_offline.py --junitxml="$RUNNER_TEMP/p04-02/prephase02-junit.xml"
      - name: L1 integrity validation
        if: always()
        run: >-
          python docs/research_v2/prephase02_offline/validate_offline.py
          --validator-commit "${{ github.event.pull_request.head.sha || github.sha }}"
          --output "$RUNNER_TEMP/p04-02/VALIDATION_GATES.json"
          --l2-junit "$RUNNER_TEMP/p04-02/prephase02-junit.xml"
          --l2-exit-code "${{ steps.legacy.outcome == 'success' && '0' || '1' }}"
      - name: Build and verify wheel
        if: always()
        shell: bash
        run: |
          python -m build --wheel --outdir "$RUNNER_TEMP/p04-02/dist"
          python -m zipfile -l "$RUNNER_TEMP/p04-02/dist/"*.whl > "$RUNNER_TEMP/p04-02/wheel-contents.txt"
          python - <<'PYCODE'
          import os, pathlib, zipfile
          wheel = next((pathlib.Path(os.environ["RUNNER_TEMP"]) / "p04-02/dist").glob("*.whl"))
          sources = list(pathlib.Path("defistress_v2/terra_pit").rglob("*.py"))
          with zipfile.ZipFile(wheel) as archive:
              for path in sources:
                  assert archive.read(path.as_posix()) == path.read_bytes(), path
          print(f"Verified {len(sources)} exact Terra PIT wheel entries")
          PYCODE
      - name: Protected-tree preservation
        if: always()
        shell: bash
        run: |
          git diff --exit-code 8ec1eb2c49c1d4c3088b2bb0550b38fb6a05bde5 -- \
            data sim backend docs/research_final docs/manuscript_p3 \
            docs/research_v2/phase01a docs/research_v2/phase01b \
            docs/research_v2/terra_early_warning/p04_01 \
            defistress_v2/contracts defistress_v2/state
      - name: Runtime provenance
        if: always()
        shell: bash
        run: |
          {
            echo "workflow_head=${{ github.event.pull_request.head.sha || github.sha }}"
            echo "checkout_commit=$(git rev-parse HEAD)"
            echo "checkout_tree=$(git rev-parse HEAD^{tree})"
            python -VV
            pytest --version
            ruff --version
            mypy --version
          } > "$RUNNER_TEMP/p04-02/execution-metadata.txt"
      - name: Artifact checksums
        if: always()
        shell: bash
        run: |
          cd "$RUNNER_TEMP/p04-02"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p04-02-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/p04-02
          if-no-files-found: error
          retention-days: 30
