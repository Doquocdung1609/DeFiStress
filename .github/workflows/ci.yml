name: ci

on:
  push:
  pull_request:

jobs:
  backend-and-simulation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m venv .venv
      - run: .\.venv\Scripts\python.exe -m pip install -e ".[dev]"
      - run: .\.venv\Scripts\ruff.exe check backend sim tests scripts
      - run: .\.venv\Scripts\mypy.exe sim
      - name: Run portable tests
        run: >-
          .\.venv\Scripts\pytest.exe
          --deselect=tests/test_final_accepted_claims_v1.py::test_builder_is_deterministic_for_versioned_outputs
          --deselect=tests/test_level3_evidence.py::test_manifest_hashes_match_all_level3_artifacts
          --deselect=tests/test_level3_p1_targeted_repair.py::test_locked_canonical_and_repair_manifest_hashes
          --deselect=tests/test_oracle_diagnostic_artifacts.py::test_oracle_diagnostic_manifest_hashes_resolve
          --deselect=tests/test_p3_g0_cross_agent_validation.py::test_builder_check_is_deterministic_and_does_not_touch_work_or_locked_sources
          --deselect=tests/test_p3_g0_evidence_blueprint.py::test_builder_check_mode_is_byte_deterministic
          --deselect=tests/test_p3_g0_evidence_blueprint.py::test_stage_g0_does_not_write_work_owned_paths
          --deselect=tests/test_p3_g0_final_delta_validation.py::test_builder_is_deterministic_and_scope_is_clean
          --deselect=tests/test_scientific_integration_v1.py::test_integration_manifest_resolves_and_preserves_locked_inputs
      - name: Verify tests did not modify locked artifacts
        run: git diff --exit-code
      - run: .\.venv\Scripts\python.exe scripts/run_demo.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm lint
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend

  real-rpc-config:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check whether the Ethereum RPC secret is configured
        id: check
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
        shell: bash
        run: |
          if [[ -n "$ETH_RPC_URL" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  real-rpc-smoke:
    needs: real-rpc-config
    if: ${{ needs.real-rpc-config.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python scripts/create_real_snapshot.py
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
