name: ci

on:
  push:
  pull_request:

jobs:
  backend-and-simulation:
    runs-on: ubuntu-latest
    steps:
      - name: Configure locked-artifact line endings
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Provide the locked Windows-style interpreter path
        shell: bash
        run: |
          mkdir -p .venv/Scripts
          ln -s "$(command -v python)" .venv/Scripts/python.exe
      - run: pip install -e '.[dev]'
      - run: ruff check backend sim tests scripts
      - run: mypy sim
      - name: Run tests except the external-DOCX reproducibility check
        run: pytest -k "not test_builder_check_mode_is_byte_deterministic"
      - run: python scripts/run_demo.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm lint
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend

  real-rpc-config:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check whether the Ethereum RPC secret is configured
        id: check
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
        shell: bash
        run: |
          if [[ -n "$ETH_RPC_URL" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  real-rpc-smoke:
    needs: real-rpc-config
    if: ${{ needs.real-rpc-config.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python scripts/create_real_snapshot.py
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
